name: build

# Tests the program on Linux against Tailscale's test server, then builds
# the PS5 payloads (scripts/build-ps5.sh). Both .elf files and the third-party
# licenses are attached to each run: Actions, the run, "wirestation-ps5" under Artifacts.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test (sign-in, exit node, TCP and UDP through it)
        run: go test -count=1 -timeout 300s ./node

      - name: Install clang 18 and lld
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 lld-18 wget unzip

      - name: Get the PS5 payload SDK
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          unzip -q ps5-payload-sdk.zip -d "$RUNNER_TEMP"
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Build the PS5 payloads
        run: |
          scripts/build-ps5.sh
          scripts/licenses.sh
          ls -l build/ps5/

      - uses: actions/upload-artifact@v4
        with:
          name: wirestation-ps5
          path: |
            build/ps5/*.elf
            build/ps5/THIRD-PARTY-LICENSES.txt
