name: build

# Builds the server payload (server/wirestation-server.elf) with the PS5
# payload SDK and runs the Linux test. The .elf is uploaded with each run:
# Actions, the run, "wirestation-server" under Artifacts.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 lld-18 wget unzip

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: tools/wgtest/go.sum

      - name: Linux test (against wireguard-go)
        run: scripts/host-test.sh

      - name: Get the PS5 payload SDK
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          unzip -q ps5-payload-sdk.zip -d "$RUNNER_TEMP"
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Build the payload
        run: |
          make -C server PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          ls -l server/wirestation-server.elf

      - uses: actions/upload-artifact@v4
        with:
          name: wirestation-server
          path: server/wirestation-server.elf
