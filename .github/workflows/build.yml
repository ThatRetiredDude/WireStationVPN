name: build

# Tests the program on Linux against Tailscale's test server, then builds
# the PS5 payload (scripts/build-ps5.sh). The .elf and the third-party
# licenses are attached to each run: Actions, the run, "wirestation-ps5" under Artifacts.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test (sign-in, exit node, TCP and UDP through it)
        run: go test -count=1 -timeout 300s ./node

      - name: Start it the way the PS5's ELF loader does (on Linux)
        run: |
          sudo mkdir -p /data/wirestation
          sudo chown "$USER" /data/wirestation
          test/elfldr-test.sh

      - name: Build the PS5 payload
        run: |
          scripts/build-ps5.sh
          scripts/licenses.sh
          ls -l build/ps5/

      - uses: actions/upload-artifact@v4
        with:
          name: wirestation-ps5
          path: |
            build/ps5/*.elf
            build/ps5/THIRD-PARTY-LICENSES.txt
